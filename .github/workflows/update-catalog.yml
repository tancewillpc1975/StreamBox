name: Update StreamBox Catalog

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Africa/Johannesburg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streambox-catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate catalog
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python update_catalog.py

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- catalog.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Auto-update StreamBox catalog"
          git push
